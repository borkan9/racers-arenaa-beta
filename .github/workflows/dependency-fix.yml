name: Dependency Security Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible audit fixes
        run: npm audit fix
      - name: Verify no high-severity vulnerabilities remain
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified lockfile updates
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix: update vulnerable dependencies"
          git push
